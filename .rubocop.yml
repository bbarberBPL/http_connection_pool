plugins:
  - rubocop-performance
  - rubocop-rake
  - rubocop-rspec

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.3
  # merge (not replace) RuboCop's default Exclude so vendor/**/* stays excluded.
  # CI installs gems into vendor/bundle inside the checkout (bundler-cache);
  # without the default excludes RuboCop descends into vendored gems and tries
  # to load their plugins (e.g. rbs ships a config demanding rubocop-rubycw).
  inherit_mode:
    merge:
      - Exclude
  Exclude:
    - "*.gemspec"

# ── Style ──────────────────────────────────────────────────────────────────
Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: always

Style/Documentation:
  Enabled: false

# ── Metrics ────────────────────────────────────────────────────────────────
Metrics/MethodLength:
  Max: 20

Metrics/ClassLength:
  Max: 150

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"

# ── RSpec ──────────────────────────────────────────────────────────────────
RSpec/MultipleExpectations:
  Max: 3

RSpec/ExampleLength:
  Max: 20

# Integration specs and the thread-safety and fiber suites describe cross-cutting
# behaviour rather than a single class, so a string description is appropriate there.
RSpec/DescribeClass:
  Exclude:
    - "spec/integration/**/*"
    - "spec/http_connection_pool/thread_safety_spec.rb"
    - "spec/http_connection_pool/fiber_spec.rb"
    - "spec/http_connection_pool/errors_spec.rb"
    - "spec/gemspec_spec.rb"
